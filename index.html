let AC=null,muted=false;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f0,f1,d,type,v,delay){
  const a=ac(); if(!a||muted)return;
  type=type||'square';v=v==null?0.1:v;delay=delay||0;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(f0,1),t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);
}
function noiseS(d,v){
  const a=ac();if(!a||muted)return;
  const t=a.currentTime,n=a.createBufferSource(),buf=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);
  n.buffer=buf;const g=a.createGain();g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  n.connect(g);g.connect(a.destination);n.start(t);
}

function musicTick(){
  if(muted||state!=='play'||!p||p.dead)return;

  const arr=bossOn?MEL.boss:horror?MEL.dark:MEL.happy;
  const f=arr[musStep%arr.length];

  }
  if(frameCount%16===0)noiseS(.03,.012);
  musStep++;
}

function newL(cols,theme,name,isNew){
  const g=[];for(let y=0;y<ROWS;y++)g.push(new Array(cols).fill('.'));
  return {cols,g,ents:[],theme,name,isNew,spawn:{x:2.5*TS,y:13*TS-40},seed:Math.floor(Math.random()*9999)};
}
function gr(L,a,b,top){top=top==null?13:top;for(let x=a;x<=b;x++)for(let y=top;y<ROWS;y++)L.g[y][x]='#';}
function rw(L,a,b,y,c){for(let x=a;x<=b;x++)L.g[y][x]=c;}
function tl(L,x,y,c){L.g[y][x]=c;}
function coRow(L,a,b,y){for(let x=a;x<=b;x++)L.g[y][x]='C';}
function spikes(L,a,b,y){rw(L,a,b,y==null?12:y,'^');}
function lava(L,a,b){rw(L,a,b,13,'L');rw(L,a,b,14,'L');}
function pipe(L,x,h){for(let dx=0;dx<2;dx++)for(let y=13-h;y<ROWS;y++)L.g[y][x+dx]='P';}
function stairs(L,x,h,dir){
  for(let i=0;i<h;i++){
    const hh=dir>0?i+1:h-i,cx=x+i;
    for(let y=13-hh;y<ROWS;y++)L.g[y][cx]='#';
  }
}
function en(L,k,x,top){L.ents.push({k,x,top:top==null?13:top});}
function cp(L,x){L.ents.push({k:'cp',x});}
function gl(L,x){L.ents.push({k:'goal',x});}
function mph(L,x,y,r,spd){L.ents.push({k:'mph',x,y,r,spd:spd||1.5});}
function mpv(L,x,y0,y1,spd){L.ents.push({k:'mpv',x,y0,y1,spd:spd||1.2});}

function settleEnt(e){
  let guard=0;
  while(guard++<8){
    const gy=Math.floor((e.y+e.h-1)/TS);
    let inside=false;
    for(let gx=Math.floor(e.x/TS);gx<=Math.floor((e.x+e.w-1)/TS);gx++)
      if(isSolid(gx,gy)){inside=true;break;}
    if(!inside)break;
    e.y-=TS;
  }
}

function loadStage(i){
  lvl=LEVELS[i]();
  p={x:lvl.spawn.x,y:lvl.spawn.y,w:26,h:34,vx:0,vy:0,face:1,big:false,
     grounded:false,plat:null,coyote:0,jbuf:0,inv:0,jumps:0,
     hp:1,maxhp:1,star:0,gpound:false,combo:0,
     dead:false,deadT:0,anim:0,squash:0,stun:0};
  respawn={x:p.x,y:p.y};
  enemies=[];plats=[];parts=[];pops=[];fires=[];ghosts=[];traps=[];bombs=[];stars=[];meteors=[];pillars=[];toasts=[];
  fmeta=new Map();
  bossDef=null;bossRef=null;bossActive=false;camLock=null;
  standT=0;trapTimer=0;bombTimer=0;meteorTimer=0;stageTime=0;stDeaths=0;camX=0;
  wind={mode:0,t:0,timer:0};whimSwap=false;whimT=0;reaper={x:-9999,beat:0};
  for(const e of lvl.ents){
    if(e.k==='kuri'){const o={kind:'kuri',x:e.x*TS,y:e.top*TS-30,w:30,h:30,dir:-1,vx:0,vy:0,t:Math.random()*99};settleEnt(o);enemies.push(o);}
    if(e.k==='toge'){const o={kind:'toge',x:e.x*TS,y:e.top*TS-28,w:32,h:28,dir:-1,vx:0,vy:0,t:Math.random()*99};settleEnt(o);enemies.push(o);}
    if(e.k==='pata')enemies.push({kind:'pata',x:e.x*TS,y:0,w:32,h:28,baseY:e.top*TS,dir:1,t:Math.random()*99,ox:e.x*TS});
    if(e.k==='shooter')enemies.push({kind:'shooter',x:e.x*TS,y:e.top*TS,w:36,h:36,top:e.top*TS,t:Math.floor(Math.random()*120),out:0,cool:0});
    if(e.k==='cp')enemies.push({kind:'cp',x:e.x*TS,y:13*TS,on:false});

    if(e.k==='mph')plats.push({type:'h',x:e.x*TS,y:e.y*TS,w:72,h:14,x0:e.x*TS,x1:(e.x+e.r)*TS,dir:1,spd:e.spd,dx:0,dy:0});
    if(e.k==='mpv')plats.push({type:'v',x:e.x*TS,y:e.y1*TS,w:72,h:14,y0:e.y0*TS,y1:e.y1*TS,dir:-1,spd:e.spd,dx:0,dy:0});
    if(e.k==='boss')bossDef={kind:e.kind,x:e.x*TS,ax0:e.ax0*TS,ax1:e.ax1*TS,gx:e.gx*TS};
  }
}

function tile(gx,gy){
  if(gy<0||gy>=ROWS)return '.';
  if(gx<0||gx>=lvl.cols)return '#';
  return lvl.g[gy][gx];
}
function isSolid(gx,gy){
  const c=tile(gx,gy);
  if(c==='#'||c==='X'||c==='B'||c==='?'||c==='U'||c==='P'||c==='M'||c==='★')return true;
  if(c==='F'){const m=fmeta.get(gx+','+gy);return !(m&&m.s>=2);}
  return false;
}

function phys(){
  let g=0.65,jv=-13.2,acc=0.45,fr=0.85,maxs=4.8;
  if(hasCurse('heavy'))g*=1.15;
  if(hasCurse('ice')){fr=0.988;acc=0.38;}
  if(hasCurse('rush')){maxs*=1.55;acc*=1.6;}
  if(hasCurse('slow')){maxs*=0.62;acc*=0.8;}
  return {g,jv,acc,fr,maxs};
}

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function toast(txt,col){toasts.push({txt,col:col||'#fff',t:0});}
function burst(x,y,col,n,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=(Math.random()*0.7+0.3)*spd;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:30+Math.random()*25,col,size:2+Math.random()*3,g:0.15});
  }
}
function dust(x,y,n){for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-0.5)*16,y,vx:(Math.random()-0.5)*2,vy:-Math.random()*1.5,life:20,col:'rgba(255,255,255,0.7)',size:2+Math.random()*2,g:0.05});}
function popup(x,y,txt,col){pops.push({x,y,vy:-1.6,t:0,txt,col:col||'#fff'});}
function addScore(n,x,y){score+=n;if(x!=null)popup(x,y,'+'+n,'#ffd740');}

function kill(msg){
  if(!p||p.dead)return;
  p.dead=true;p.deadT=0;deaths++;stDeaths++;shake=12;
  S.die();burst(p.x+p.w/2,p.y+p.h/2,'#ff5252',20,4);
  burst(p.x+p.w/2,p.y+p.h/2,'#fff',10,3);
  toast(msg||'ミス！','#ff8a80');
}
function damage(msg){
  if(!p||p.dead||p.inv>0||p.star>0)return;
  kill(msg||'ミス！');
}
function respawnPlayer(){
  p.x=respawn.x;p.y=respawn.y;p.vx=0;p.vy=0;p.dead=false;p.inv=90;
  p.stun=0;p.plat=null;p.jumps=0;p.gpound=false;p.hp=p.maxhp;p.star=0;
  standT=0;fires=[];traps=[];bombs=[];pillars=[];meteors=[];
  if(hasCurse('reaper'))reaper.x=p.x-520;
  ghosts.forEach(g=>{g.x+=(g.x>p.x?300:-300);g.cool=120;});
}

function stageClear(){
  if(state!=='play')return;
  state='clear';clearT=0;S.clear();
  stageRank=stDeaths===0?'S':stDeaths<=2?'A':stDeaths<=5?'B':'C';
  ranks.push(stageRank);
  addScore(Math.max(200,1000-stDeaths*150));
  for(let i=0;i<60;i++)parts.push({x:camX+Math.random()*W,y:-20-Math.random()*200,
    vx:(Math.random()-0.5)*1,vy:1+Math.random()*2,life:200,
    col:['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb'][i%5],size:3+Math.random()*3,g:0.02});
}

function hitQ(gx,gy){
  const c=lvl.g[gy][gx];
  lvl.g[gy][gx]='U';shake=2;
  if(c==='?'){
    coins++;S.qblock();addScore(10);
    pops.push({x:gx*TS+TS/2,y:gy*TS-8,vy:-5,t:0,coin:true});
    burst(gx*TS+TS/2,gy*TS,'#ffd740',6,2);
  }else if(c==='M'){
    S.heal();
    addScore(50,gx*TS+TS/2,gy*TS-10);
    burst(gx*TS+TS/2,gy*TS,'#ff80ab',10,2.5);
  }else if(c==='★'){
    S.power();
    stars.push({x:gx*TS+6,y:gy*TS-30,w:24,h:24,vx:1.7,vy:-7,t:0});
    burst(gx*TS+TS/2,gy*TS,'#ffd740',10,3);
  }
}
function touchF(gx,gy){
  const k=gx+','+gy,m=fmeta.get(k);
  if(!m)fmeta.set(k,{s:1,t:0});
}

function poundFX(){
  p.gpound=false;
  shake=7;S.pound();flash=3;
  for(let i=0;i<14;i++){
    const a=Math.PI+i*(Math.PI/13);
    parts.push({x:p.x+p.w/2,y:p.y+p.h,vx:Math.cos(a)*3.5,vy:Math.sin(a)*2,life:22,col:'rgba(255,220,150,0.9)',size:3,g:0.1});
  }
  const cx=p.x+p.w/2,cy=p.y+p.h/2;
  for(const e of enemies){
    if(e.kind==='cp'||e.kind==='goal'||e.kind==='shooter')continue;
    const ex=e.x+e.w/2,ey=e.y+e.h/2;
    if(Math.hypot(ex-cx,ey-cy)<80){
      if(e.kind==='toge'){kill('トゲに激突した！');continue;}
      e.gone=true;S.stomp();freeze=4;
      p.combo++;const pts=100*Math.pow(2,Math.min(p.combo-1,4));
      addScore(pts,ex,e.y);
      burst(ex,ey,'#b98a4a',10,3);
    }
  }
  enemies=enemies.filter(e=>!e.gone);
  const gx0=Math.floor(p.x/TS),gx1=Math.floor((p.x+p.w)/TS);
  for(let gx=gx0;gx<=gx1;gx++){
    const gy=Math.floor((p.y+p.h)/TS);
    for(let d=0;d<2;d++){
      if(tile(gx,gy+d)==='F'){
        const k=gx+','+(gy+d),m=fmeta.get(k);
        fmeta.set(k,{s:2,t:m?m.t:41});
      }
    }
  }
}

function updatePlayer(){
  const ph=phys();
  if(p.dead){p.deadT++;if(p.deadT>75)respawnPlayer();return;}
  if(hasCurse('giant')&&!p.big){
    p.big=true;p.w=38;p.h=48;p.y-=14;
    shake=8;toast('巨大化！！','#ef6c00');dust(p.x+p.w/2,p.y+p.h,14);
  }
  if(p.star>0)p.star--;
  let Lft=held.ArrowLeft||held.KeyA,Rgt=held.ArrowRight||held.KeyD;
  const swapped=hasCurse('mirror')!==(hasCurse('whim')&&whimSwap);
  if(swapped){const t=Lft;Lft=Rgt;Rgt=t;}
  if(p.stun>0){p.stun--;Lft=false;Rgt=false;}
  if(p.gpound){Lft=false;Rgt=false;}
  const acM=p.grounded?ph.acc:ph.acc*0.6;
  if(Lft){p.vx-=acM;p.face=-1;}
  if(Rgt){p.vx+=acM;p.face=1;}
  const skidding=p.grounded&&((Lft&&p.vx>2.5)||(Rgt&&p.vx<-2.5));
  if(skidding){
    p.vx*=0.9;
    if(frameCount%4===0)dust(p.x+p.w/2,p.y+p.h,1);
    if(frameCount%14===0)S.skid();
  }
  if(!Lft&&!Rgt)p.vx*=p.grounded?ph.fr:0.97;
  if(wind.mode===2)p.vx-=0.38;
  if(p.vx>ph.maxs)p.vx=ph.maxs;if(p.vx<-ph.maxs)p.vx=-ph.maxs;
  if(Math.abs(p.vx)<0.05)p.vx=0;

  if(jumpJP())p.jbuf=7;else if(p.jbuf>0)p.jbuf--;
  if(p.grounded)p.coyote=7;else if(p.coyote>0)p.coyote--;
  if(p.jbuf>0&&!p.gpound){
    if(p.coyote>0){
      p.vy=ph.jv;p.grounded=false;p.plat=null;p.coyote=0;p.jbuf=0;p.jumps=1;
      S.jump();dust(p.x+p.w/2,p.y+p.h,4);
    }else if(difficulty==='easy'&&p.jumps===1){
      p.vy=ph.jv*0.92;p.jbuf=0;p.jumps=2;
      S.jump2();burst(p.x+p.w/2,p.y+p.h-4,'rgba(255,255,255,0.9)',8,2.2);
    }
  }
  if(!p.grounded&&!p.gpound&&downJP()){
    p.gpound=true;p.vy=15;p.vx*=0.2;S.woosh();
  }
  if(p.gpound&&p.vy<15)p.vy=15;
  if(p.vy<-4&&!jumpHeld()&&!p.gpound)p.vy=-4;
  p.vy+=ph.g;if(p.vy>16)p.vy=16;

  p.x+=p.vx;
  if(p.vx>0){
    const gx=Math.floor((p.x+p.w)/TS);
    for(let gy=Math.floor(p.y/TS);gy<=Math.floor((p.y+p.h-1)/TS);gy++)
      if(isSolid(gx,gy)){p.x=gx*TS-p.w-0.01;p.vx=0;break;}
  }else if(p.vx<0){
    const gx=Math.floor(p.x/TS);
    for(let gy=Math.floor(p.y/TS);gy<=Math.floor((p.y+p.h-1)/TS);gy++)
      if(isSolid(gx,gy)){p.x=(gx+1)*TS+0.01;p.vx=0;break;}
  }

  const prevBottom=p.y+p.h,wasFall=p.vy>6,wasGP=p.gpound;
  p.y+=p.vy;
  p.grounded=false;
  if(p.vy>=0){
    const gy=Math.floor((p.y+p.h)/TS);
    for(let gx=Math.floor(p.x/TS);gx<=Math.floor((p.x+p.w-1)/TS);gx++){
      const c=tile(gx,gy);
      let land=false;
      if(isSolid(gx,gy))land=true;
      else if(c==='='&&prevBottom<=gy*TS+10)land=true;
      if(land){
        p.y=gy*TS-p.h;p.vy=0;p.grounded=true;
        if(c==='F')touchF(gx,gy);
        if(wasFall&&!wasGP){S.thud();p.squash=6;dust(p.x+p.w/2,p.y+p.h,5);}
        break;
      }
    }
  }else{
    const gy=Math.floor(p.y/TS);
    for(let gx=Math.floor(p.x/TS);gx<=Math.floor((p.x+p.w-1)/TS);gx++){
      if(isSolid(gx,gy)){
        p.y=(gy+1)*TS+0.01;p.vy=0;
        const c2=tile(gx,gy);
        if(c2==='?'||c2==='M'||c2==='★')hitQ(gx,gy);
        break;
      }
    }
  }
  if(p.squash>0)p.squash--;
  if(p.inv>0)p.inv--;
  if(p.grounded){p.jumps=0;if(wasGP)poundFX();p.combo=0;}
  if(Math.abs(p.vx)>0.5&&p.grounded)p.anim++;

  const gx0=Math.floor(p.x/TS),gx1=Math.floor((p.x+p.w)/TS);
  const gy0=Math.floor(p.y/TS),gy1=Math.floor((p.y+p.h)/TS);
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){
    const c=tile(gx,gy);
    if(c==='C'){lvl.g[gy][gx]='.';coins++;S.coin();addScore(10);burst(gx*TS+TS/2,gy*TS+TS/2,'#ffd740',6,2);}
    else if(c==='^'){
      if(p.x+p.w>gx*TS+6&&p.x<gx*TS+TS-6&&p.y+p.h>gy*TS+14)kill('トゲに刺さった！');
    }else if(c==='L'){
      if(p.y+p.h>gy*TS+10){burst(p.x+p.w/2,gy*TS+10,'#ff9100',12,3);kill('溶岩に沈んだ…');}
    }
  }
  if(p.y>H+120)kill('谷底に落ちた…');

  p.plat=null;
  if(p.vy>=0){
    for(const pl of plats){
      if(prevBottom<=pl.y+10&&p.y+p.h>=pl.y&&p.x+p.w>pl.x+4&&p.x<pl.x+pl.w-4){
        p.y=pl.y-p.h;p.vy=0;p.grounded=true;p.plat=pl;
      }
    }
  }
  if(p.plat){p.x+=p.plat.dx;if(p.plat.type==='v')p.y=p.plat.y-p.h;}

  if(hasCurse('stop')&&!p.dead){
    let spd=Math.abs(p.vx);
    if(p.plat)spd+=Math.abs(p.plat.dx)+Math.abs(p.plat.dy||0);
    if(p.grounded&&spd<0.35){
      standT++;
      if(standT===80)S.heart();
      if(standT===105)S.heart();
      if(standT>=120){standT=0;kill('呪いが発動した…止まるな！');}
    }else standT=0;
  }else standT=0;

  for(const s of stars){
    if(!s.gone&&overlap(p,s)){
      s.gone=true;p.star=360;S.power();addScore(200);
      toast('むてきモード！！','#ffd740');
      burst(s.x+12,s.y+12,'#ffd740',20,4);
    }
  }
  for(const e of enemies)if(e.kind==='goal'){
    if(p.x+p.w>e.x+8)stageClear();
  }
  for(const e of enemies)if(e.kind==='cp'&&!e.on){
    if(Math.abs((p.x+p.w/2)-(e.x+TS/2))<26){
      e.on=true;respawn={x:e.x,y:13*TS-p.h};
      S.cp();toast('中間ポイント！','#69f0ae');
      burst(e.x+TS/2,e.y-60,'#ffd740',14,3);
    }
  }
}

function updateEnemies(){
  const hunted=hasCurse('hunted');
  for(const e of enemies){
    if(e.kind==='kuri'||e.kind==='toge'){
      const spd=(e.kind==='kuri'?1.1:0.85)*(hunted?1.65:1);
      e.vy+=0.6;if(e.vy>12)e.vy=12;
      e.x+=e.dir*spd;
      if(e.dir>0){
        const gx=Math.floor((e.x+e.w)/TS),gy=Math.floor((e.y+e.h/2)/TS);
        if(isSolid(gx,gy)){e.x=gx*TS-e.w;e.dir=-1;}
      }else{
        const gx=Math.floor(e.x/TS),gy=Math.floor((e.y+e.h/2)/TS);
        if(isSolid(gx,gy)){e.x=(gx+1)*TS;e.dir=1;}
      }
      e.y+=e.vy;
      const gy2=Math.floor((e.y+e.h)/TS);
      let grounded=false;
      for(let gx=Math.floor(e.x/TS);gx<=Math.floor((e.x+e.w-1)/TS);gx++)
        if(isSolid(gx,gy2)){e.y=gy2*TS-e.h;e.vy=0;grounded=true;break;}
      if(grounded&&!hunted){
        const ax=e.dir>0?e.x+e.w+2:e.x-2;
        if(!isSolid(Math.floor(ax/TS),Math.floor((e.y+e.h+6)/TS)))e.dir*=-1;
      }
      if(e.y>H+80)e.gone=true;
      e.t++;
    }
    else if(e.kind==='pata'){
      e.t++;
      e.x+=e.dir*(hunted?1.6:1.0);
      if(e.x>e.ox+90)e.dir=-1;if(e.x<e.ox-90)e.dir=1;
      e.y=e.baseY+Math.sin(e.t*0.06)*24-14;
    }
    else if(e.kind==='shooter'){
      e.t=(e.t+1)%210;
      const ph2=e.t;
      e.out=ph2<100?0:ph2<130?(ph2-100)/30:ph2<170?1:(210-ph2)/40;
      if(e.cool>0)e.cool--;
      if(ph2===140||ph2===158){
        if(Math.abs(p.x-e.x)<460&&e.cool<=0&&!p.dead){
          const dir=Math.sign(p.x-e.x)||1;
          fires.push({x:e.x+e.w/2,y:e.top-e.out*30,vx:dir*2.6,vy:-5.5,g:0.22,t:0});
          tone(300,150,.15,'sawtooth',.06);e.cool=10;
        }
      }
    }
  }
  enemies=enemies.filter(e=>!e.gone);

  if(!p.dead&&state==='play'){
    for(const e of enemies){
      if(e.kind==='cp'||e.kind==='goal'||e.kind==='shooter'&&e.out<=0)continue;
      let box;
      if(e.kind==='shooter')box={x:e.x+6,y:e.top-e.out*30,w:e.w-12,h:28};
      else box=e;
      if(!overlap(p,box))continue;
      if(p.star>0){
        e.gone=true;addScore(100,box.x+box.w/2,box.y);S.stomp();
        burst(box.x+box.w/2,box.y+box.h/2,'#ffd740',12,3);
        continue;
      }
      const stomp=(p.vy>0.5&&(p.y+p.h)<box.y+box.h*0.65)||(p.gpound&&overlap(p,box));
      if(e.kind==='toge'){kill('マルマインは踏めない！');continue;}
      if(stomp){
        e.gone=true;p.vy=jumpHeld()?-12.5:-9;if(p.gpound)p.gpound=false;
        S.stomp();freeze=4;shake=3;
        p.combo++;
        const pts=100*Math.pow(2,Math.min(p.combo-1,4));
        addScore(pts,box.x+box.w/2,box.y-6);
        if(p.combo>=2)popup(p.x+p.w/2,p.y-24,'COMBO x'+p.combo+'!','#ff80ab');
        burst(box.x+box.w/2,box.y+box.h/2,'#b98a4a',10,3);
      }else kill();
    }
    enemies=enemies.filter(e=>!e.gone);
  }
}

function spawnBoss(){
  if(bossDef.kind==='mid'){
    bossRef={kind:'mid',x:bossDef.x,y:13*TS-62,w:66,h:62,hp:3,maxhp:3,
      st:'idle',t:0,vx:0,vy:0,dir:-1,hurt:0,seq:0,summoned:false,name:'クリキング'};
  }else{
    bossRef={kind:'final',x:bossDef.x,y:120,w:60,h:64,hp:5,maxhp:5,
      st:'hover',t:0,atkT:120,volley:0,hurt:0,name:'ヤミオウ',
      sx:0,sy:0,tx:0,ty:0};
  }
  bossActive=true;S.bossRoar();shake=14;
  toast(bossRef.name+' が現れた！','#ff80ab');
  camLock={min:bossDef.ax0,max:bossDef.ax1-W};
}
function bossDefeated(){
  burst(bossRef.x+bossRef.w/2,bossRef.y+bossRef.h/2,'#ffd740',30,5);
  burst(bossRef.x+bossRef.w/2,bossRef.y+bossRef.h/2,'#ff5252',30,6);
  shake=16;S.clear();addScore(2000);
  popup(bossRef.x+bossRef.w/2,bossRef.y,'+2000','#ffd740');
  enemies.push({kind:'goal',x:bossDef.gx,y:13*TS});
  toast('ゴールが現れた！','#ffd740');
  bossRef.dead=true;bossActive=false;camLock=null;
}
function groundFireball(x,dir){
  fires.push({x,y:13*TS-9,vx:dir*3.2,vy:0,g:0,t:0,ground:true});
}
function updateBoss(){
  if(bossDef&&!bossActive&&!bossRef&&p.x>bossDef.ax0+TS*2&&state==='play')spawnBoss();
  if(bossDef&&bossActive&&p.x<bossDef.ax0-TS*4){bossActive=false;camLock=null;}
  if(bossDef&&!bossActive&&bossRef&&!bossRef.dead&&p.x>bossDef.ax0+TS*2){bossActive=true;camLock={min:bossDef.ax0,max:bossDef.ax1-W};}
  for(const pl of pillars){
    pl.t++;
    if(pl.t===55){tone(120,60,.3,'sawtooth',.14);shake=5;}
    if(pl.t>55&&pl.t<82&&!p.dead){
      if(Math.abs((p.x+p.w/2)-pl.x)<26&&p.y+p.h>13*TS-250)kill('闇の柱に飲まれた！');
    }
    if(pl.t>82)pl.gone=true;
  }
  pillars=pillars.filter(pl=>!pl.gone);
  if(!bossRef||bossRef.dead)return;
  const b=bossRef;
  if(b.hurt>0)b.hurt--;
  if(b.kind==='mid'){
    b.t++;
    if(b.st==='idle'){
      b.dir=Math.sign(p.x-b.x)||1;
      if(b.t>40){
        if(b.hp<=1&&!b.summoned){b.st='summon';b.t=0;}
        else if(b.seq%3===2){b.st='chargePre';b.t=0;}
        else{b.st='prep';b.t=0;}
      }
    }else if(b.st==='prep'){
      if(b.t>35){
        b.st='air';b.vy=-(11+(3-b.hp));b.vx=b.dir*(2.6+(3-b.hp)*0.55);
      }
    }else if(b.st==='air'){
      b.vy+=0.55;b.x+=b.vx;b.y+=b.vy;
      if(b.x<bossDef.ax0+8){b.x=bossDef.ax0+8;b.vx*=-0.5;}
      if(b.x+b.w>bossDef.ax1-8){b.x=bossDef.ax1-8-b.w;b.vx*=-0.5;}
      if(b.vy>0&&b.y+b.h>=13*TS){
        b.y=13*TS-b.h;b.st='idle';b.t=0;b.seq++;
        shake=6;S.thud();dust(b.x+b.w/2,13*TS,10);
        if(b.hp<=2){groundFireball(b.x,-1);groundFireball(b.x+b.w,1);}
      }
    }else if(b.st==='chargePre'){
      b.x+=Math.sin(b.t*1.4)*1.6;
      if(b.t===10)tone(200,400,.3,'sawtooth',.08);
      if(b.t>45){b.st='charge';b.vx=b.dir*6.8;}
    }else if(b.st==='charge'){
      b.x+=b.vx;
      if(frameCount%3===0)dust(b.x+(b.vx>0?0:b.w),13*TS,1);
      if(b.x<bossDef.ax0+8||b.x+b.w>bossDef.ax1-8){
        b.x=Math.max(bossDef.ax0+8,Math.min(bossDef.ax1-8-b.w,b.x));
        b.st='chargeEnd';b.t=0;shake=7;S.thud();
      }
    }else if(b.st==='chargeEnd'){
      if(b.t>55){b.st='idle';b.t=0;}
    }else if(b.st==='summon'){
      if(b.t===20){
        S.bossRoar();shake=10;b.summoned=true;
        enemies.push({kind:'kuri',x:bossDef.ax0+40,y:13*TS-30,w:30,h:30,dir:1,vx:0,vy:0,t:0});
        enemies.push({kind:'kuri',x:bossDef.ax1-70,y:13*TS-30,w:30,h:30,dir:-1,vx:0,vy:0,t:0});
        toast('手下を呼び出した！','#ffab91');
      }
      if(b.t>50){b.st='idle';b.t=0;}
    }
  }else{
    b.t++;
    const enraged=b.hp<=2;
    const cx=Math.max(bossDef.ax0+40,Math.min(bossDef.ax1-100,p.x));
    if(b.st==='hover'){
      b.x+=(cx-b.x)*(enraged?0.035:0.02);
      b.y=110+Math.sin(b.t*(enraged?0.07:0.04))*26;
      b.atkT--;
      if(frameCount%6===0)parts.push({x:b.x+Math.random()*b.w,y:b.y+Math.random()*b.h,
        vx:(Math.random()-0.5),vy:(Math.random()-0.5),life:25,col:'rgba(150,60,255,0.5)',size:3,g:0});
      if(b.atkT<=0){
        const pool=['swoop','fire'];
        if(b.hp<=4)pool.push('burst');
        if(b.hp<=3)pool.push('pillar','pillar');
        if(b.hp<=2)pool.push('ghosts');
        const pick=pool[Math.floor(Math.random()*pool.length)];
        if(pick==='swoop'){b.st='windup';b.t=0;}
        else if(pick==='fire'){b.st='fire';b.t=0;b.volley=3;}
        else if(pick==='burst'){b.st='burst';b.t=0;}
        else if(pick==='pillar'){
          b.st='pillarw';b.t=0;
          pillars.push({x:Math.max(bossDef.ax0+30,Math.min(bossDef.ax1-30,p.x+p.w/2)),t:0});
          pillars.push({x:Math.max(bossDef.ax0+30,Math.min(bossDef.ax1-30,p.x+p.w/2-130)),t:0});
          pillars.push({x:Math.max(bossDef.ax0+30,Math.min(bossDef.ax1-30,p.x+p.w/2+130)),t:0});
          S.warn();
        }
        else{b.st='ghosts';b.t=0;}
      }
    }else if(b.st==='windup'){
      b.x+=Math.sin(b.t*1.5)*2;
      if(b.t>38){
        b.st='swoop';b.t=0;b.sx=b.x;b.sy=b.y;
        b.tx=Math.max(bossDef.ax0+20,Math.min(bossDef.ax1-80,p.x-10));b.ty=13*TS-b.h;
      }
    }else if(b.st==='swoop'){
      const dur=enraged?20:26;
      const t=Math.min(b.t/dur,1),e=t*t;
      const mx=(b.sx+b.tx)/2,my=Math.min(b.sy,b.ty)-140;
      b.x=(1-e)*(1-e)*b.sx+2*(1-e)*e*mx+e*e*b.tx;
      b.y=(1-e)*(1-e)*b.sy+2*(1-e)*e*my+e*e*b.ty;
      if(b.t>=dur){b.st='recover';b.t=0;}
    }else if(b.st==='recover'){
      b.y-=3.2;b.x+=(cx-b.x)*0.05;
      if(b.t>34||b.y<=110){b.st='hover';b.atkT=enraged?80:(b.hp<=3?110:150);b.t=0;}
    }else if(b.st==='fire'){
      if(b.t%14===0&&b.volley>0){
        b.volley--;
        const dir=Math.sign(p.x-b.x)||1;
        fires.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:dir*(2.4+Math.random()),vy:-2.5,g:0.13,t:0});
        tone(400,200,.15,'sawtooth',.07);
      }
      if(b.volley<=0&&b.t>40){b.st='hover';b.atkT=enraged?80:140;b.t=0;}
    }else if(b.st==='burst'){
      if(b.t===22){
        tone(300,80,.3,'sawtooth',.1);
        for(let i=0;i<8;i++){
          const a=i*Math.PI/4+0.3;
          fires.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:Math.cos(a)*2.3,vy:Math.sin(a)*2.3,g:0.02,t:0});
        }
        burst(b.x+b.w/2,b.y+b.h/2,'#b388ff',14,3);
      }
      if(b.t>55){b.st='hover';b.atkT=enraged?85:130;b.t=0;}
    }else if(b.st==='pillarw'){
      if(b.t>85){b.st='hover';b.atkT=enraged?80:120;b.t=0;}
    }else if(b.st==='ghosts'){
      if(b.t===15){
        S.ghost();
        ghosts.push({x:b.x,y:b.y+20,vx:-1,vy:0,t:0,cool:60,boss:true});
        ghosts.push({x:b.x+b.w,y:b.y+20,vx:1,vy:0,t:0,cool:60,boss:true});
        toast('怨霊を放った！','#b39ddb');
      }
      if(b.t>40){b.st='hover';b.atkT=enraged?90:140;b.t=0;}
    }
  }
  if(!p.dead&&overlap(p,b)){
    const stomp=(p.vy>0.5&&(p.y+p.h)<b.y+26)||(p.gpound&&overlap(p,b));
    if(stomp&&b.hurt<=0){
      b.hp--;b.hurt=70;p.vy=-12.5;p.inv=20;p.gpound=false;p.combo=0;
      S.bossHit();freeze=6;shake=8;addScore(500,b.x+b.w/2,b.y-10);
      burst(b.x+b.w/2,b.y+10,'#fff',12,4);
      if(b.hp<=0)bossDefeated();
    }else if(b.hurt<=0&&p.star<=0)kill(b.name+'にやられた！');
  }
}

function updatePlats(){
  for(const pl of plats){
    if(pl.type==='h'){
      const nx=pl.x+pl.dir*pl.spd;
      if(nx<pl.x0){pl.x=pl.x0;pl.dir=1;}
      else if(nx>pl.x1){pl.x=pl.x1;pl.dir=-1;}
      else pl.x=nx;
    }else{
      const ny=pl.y+pl.dir*pl.spd;
      if(ny<pl.y0){pl.y=pl.y0;pl.dir=1;}
      else if(ny>pl.y1){pl.y=pl.y1;pl.dir=-1;}
      else pl.y=ny;
    }
    pl.dx=pl.type==='h'?pl.dir*pl.spd:0;
    pl.dy=pl.type==='v'?pl.dir*pl.spd:0;
  }
}
function updateFmeta(){
  for(const [k,m] of fmeta){
    m.t++;
    if(m.s===1&&m.t>40){m.s=2;m.t=0;S.crumble();}
    if(m.s===2&&m.t>240){
      const [gx,gy]=k.split(',').map(Number);
      const box={x:gx*TS,y:gy*TS,w:TS,h:TS};
      if(!overlap(p,box)){m.s=0;m.t=0;}
    }
  }
}
function updateFires(){
  for(const f of fires){
    if(f.ground){
      f.x+=f.vx;f.t++;
      if(isSolid(Math.floor((f.x+(f.vx>0?8:-8))/TS),Math.floor(f.y/TS))||f.t>240){f.gone=true;burst(f.x,f.y,'#ff9100',4,2);}
    }else{
      f.vy+=f.g;f.x+=f.vx;f.y+=f.vy;f.t++;
      if(f.t%3===0)parts.push({x:f.x,y:f.y,vx:0,vy:0,life:12,col:'rgba(255,140,0,0.6)',size:3,g:0});
      if(isSolid(Math.floor(f.x/TS),Math.floor(f.y/TS))||f.y>H+40||f.t>300){f.gone=true;burst(f.x,f.y,'#ff9100',5,2);}
    }
    if(!f.gone&&!p.dead&&Math.abs(f.x-(p.x+p.w/2))<p.w/2+7&&Math.abs(f.y-(p.y+p.h/2))<p.h/2+7){
      f.gone=true;kill('火ダルマになった！');
    }
  }
  fires=fires.filter(f=>!f.gone);
}
function updateStars(){
  for(const s of stars){
    s.t++;s.vy+=0.5;s.x+=s.vx;s.y+=s.vy;
    const gy=Math.floor((s.y+s.h)/TS);
    let hit=false;
    for(let gx=Math.floor(s.x/TS);gx<=Math.floor((s.x+s.w)/TS);gx++)
      if(isSolid(gx,gy)){hit=true;break;}
    if(hit&&s.vy>0){s.y=gy*TS-s.h;s.vy=-7.5;}
    if(isSolid(Math.floor((s.x+(s.vx>0?s.w:0))/TS),Math.floor((s.y+s.h/2)/TS)))s.vx*=-1;
    if(s.y>H+60||s.x<-60||s.x>lvl.cols*TS+60)s.gone=true;
    if(s.t%4===0)parts.push({x:s.x+12,y:s.y+12,vx:(Math.random()-0.5),vy:(Math.random()-0.5),life:18,col:'#ffd740',size:2,g:0});
  }
  stars=stars.filter(s=>!s.gone);
}

function updateCurseSystems(){
  if(hasCurse('whim')){
    whimT++;
    if(whimT>=240){whimT=0;whimSwap=!whimSwap;S.tick();}
  }
  if(hasCurse('wind')){
    wind.timer++;
    if(wind.mode===0&&wind.timer>210){wind.mode=1;wind.t=0;S.wind();}
    else if(wind.mode===1){
      wind.t++;
      if(wind.t>55){wind.mode=2;wind.t=0;shake=4;}
    }else if(wind.mode===2){
      wind.t++;
      if(frameCount%3===0)parts.push({x:camX+W+10,y:Math.random()*H,vx:-14,vy:(Math.random()-0.5)*2,life:30,col:'rgba(180,255,240,0.5)',size:3,g:0});
      if(wind.t>85){wind.mode=0;wind.timer=0;}
    }
  }
  if(hasCurse('reaper')&&!p.dead){
    if(reaper.x<-9000)reaper.x=p.x-520;
    reaper.x+=3.0;
    if(reaper.x<p.x-640)reaper.x=p.x-640;
    const dist=p.x-reaper.x;
    if(dist<260){
      reaper.beat++;
      if(reaper.beat%55===0)S.heart();
    }
    if(reaper.x+34>p.x+p.w)kill('死神に魂を抜かれた…！');
    if(frameCount%3===0)parts.push({x:reaper.x+Math.random()*40-20,y:380+Math.random()*80,vx:-0.5,vy:-0.3,life:40,col:'rgba(30,15,50,0.6)',size:5,g:0});
  }
  if(hasCurse('meteor')){
    meteorTimer++;
    if(meteorTimer>150&&meteors.length<3){
      meteorTimer=0;
      meteors.push({x:p.x+120+Math.random()*340,y:-40,vx:-2.6,vy:4.4,t:0});
      tone(1400,300,.4,'sawtooth',.04);
    }
  }
  for(const m of meteors){
    m.x+=m.vx;m.y+=m.vy;m.t++;
    if(frameCount%2===0)parts.push({x:m.x,y:m.y,vx:(Math.random()-0.5),vy:-1,life:20,col:Math.random()<0.5?'#ff9100':'#ffd740',size:3,g:0});
    if(m.t>10&&isSolid(Math.floor(m.x/TS),Math.floor(m.y/TS))){
      m.gone=true;S.explode();shake=8;
      burst(m.x,m.y,'#ff9100',24,5);burst(m.x,m.y,'#ffd740',12,3);
      if(!p.dead&&p.star<=0&&Math.hypot(p.x+p.w/2-m.x,p.y+p.h/2-m.y)<66)kill('メテオが直撃した！');
    }
    if(m.y>H+60||m.x<camX-100)m.gone=true;
  }
  meteors=meteors.filter(m=>!m.gone);
  if(hasCurse('trap')){
    trapTimer++;
    if(trapTimer>220&&traps.length<2){
      trapTimer=0;
      for(let i=0;i<20;i++){
        const gx=Math.floor(p.x/TS)+Math.floor(Math.random()*15)-7;
        for(let gy=2;gy<ROWS;gy++){
          if(!isSolid(gx,gy-1)&&isSolid(gx,gy)&&tile(gx,gy-1)==='.'){
            traps.push({gx,gy,t:0});S.warn();i=99;break;
          }
        }
      }
    }
    for(const tr of traps){
      tr.t++;
      if(tr.t===55)tone(600,150,.2,'sawtooth',.08);
      if(tr.t>55&&tr.t<130&&!p.dead){
        const box={x:tr.gx*TS+4,y:tr.gy*TS-26,w:TS-8,h:32};
        if(overlap(p,box)&&p.star<=0)kill('罠が発動した！');
      }
      if(tr.t>130)tr.gone=true;
    }
    traps=traps.filter(t=>!t.gone);
  }
  if(hasCurse('bomb')){
    bombTimer++;
    if(bombTimer>175&&bombs.length<3){
      bombTimer=0;
      const bx=Math.max(TS,Math.min(lvl.cols*TS-TS,p.x+p.w/2+(Math.random()*220-80)));
      bombs.push({x:bx,y:-20,vy:0,t:0,landed:false});
      S.warn();
    }
  }
  for(const b of bombs){
    if(!b.landed){
      b.vy+=0.4;b.y+=b.vy;
      const gy=Math.floor((b.y+10)/TS),gx=Math.floor(b.x/TS);
      if(b.vy>0&&isSolid(gx,gy)){b.y=gy*TS-10;b.landed=true;b.t=0;S.thud();}
      if(b.y>H+60)b.gone=true;
    }else{
      b.t++;
      if(b.t===70){
        b.gone=true;S.explode();shake=10;flash=4;
        burst(b.x,b.y,'#ff9100',26,5);burst(b.x,b.y,'#fff',12,3);
        if(!p.dead&&p.star<=0&&Math.hypot(p.x+p.w/2-b.x,p.y+p.h/2-b.y)<80)kill('爆発に巻き込まれた！');
      }
    }
  }
  bombs=bombs.filter(b=>!b.gone);
  if(hasCurse('ghost')){
    while(ghosts.length<4){
      const side=Math.random()<0.5;
      ghosts.push({x:camX+(side?-40:W+40),y:80+Math.random()*300,
        vx:0,vy:0,t:Math.random()*99,cool:0,boss:false});
    }
    ghostAmb++;
    if(ghostAmb>380){ghostAmb=0;S.ghost();}
  }else{
    ghosts=ghosts.filter(g=>g.boss);
  }
  for(const g of ghosts){
    g.t++;if(g.cool>0)g.cool--;
    const dx=(p.x+p.w/2)-g.x,dy=(p.y+p.h/2)-g.y;
    const d=Math.hypot(dx,dy)||1;
    g.vx+=dx/d*0.025;g.vy+=dy/d*0.02;
    const sp=Math.hypot(g.vx,g.vy);
    if(sp>1.35){g.vx*=1.35/sp;g.vy*=1.35/sp;}
    g.x+=g.vx;g.y+=g.vy+Math.sin(g.t*0.08)*0.4;
    if(g.cool<=0&&!p.dead&&Math.abs(g.x-(p.x+p.w/2))<22&&Math.abs(g.y-(p.y+p.h/2))<26){
      g.cool=150;p.stun=40;
      p.vx=Math.sign(p.x-g.x)*5||3;p.vy=-5;
      S.ghost();shake=5;toast('幽霊に取り憑かれた！','#b39ddb');
    }
  }
}
function updateParts(){
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.life--;}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops){q.y+=q.vy;q.vy*=0.96;q.t++;}
  pops=pops.filter(q=>q.t<45);
  for(const t of toasts)t.t++;
  toasts=toasts.filter(t=>t.t<110);
  if(lvl){
    const th=lvl.theme;
    if(th===6&&frameCount%8===0)parts.push({x:camX+Math.random()*W,y:H,vx:0,vy:-0.6-Math.random(),life:90,col:'rgba(255,120,30,0.7)',size:2,g:0});
    if(th===7&&frameCount%10===0)parts.push({x:camX+Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.4,vy:-0.2,life:100,col:'rgba(170,120,255,0.4)',size:2,g:0});
    if(th===2&&frameCount%14===0)parts.push({x:camX+Math.random()*W,y:200+Math.random()*250,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,life:120,col:'rgba(220,255,120,0.5)',size:2,g:0});
  }
}
function updateCamera(){
  let target=p.x+p.w/2-W*0.45;
  if(camLock&&bossActive)target=Math.max(camLock.min,Math.min(camLock.max,target));
  target=Math.max(0,Math.min(lvl.cols*TS-W,target));
  camX+=(target-camX)*0.12;
  if(bossActive&&camLock){camX=Math.max(camLock.min,Math.min(camLock.max,camX));}
  if(shake>0)shake*=0.86;if(shake<0.3)shake=0;
}

/* ============================ 描画 ============================ */
function rrect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawHero(cx,fy,face,animT,air,o){
  o=o||{};const s=o.s||1;
  ctx.save();ctx.translate(cx,fy);ctx.scale(face*s,s);
  const sq=o.squash?o.squash*0.04:0;ctx.scale(1+sq,1-sq);
  const walk=o.moving&&!air?Math.sin(animT*0.5)*4:0;
  const starCol=o.star>0?['#ff5252','#ffd740','#69f0ae','#40c4ff'][(frameCount>>2)%4]:null;
  ctx.fillStyle='#5d3413';
  ctx.fillRect(-11+walk,-6,10,6);ctx.fillRect(1-walk,-6,10,6);
  ctx.fillStyle=starCol||'#2b5fd9';ctx.fillRect(-10,-18,20,13);
  ctx.fillStyle=starCol||'#e3350d';ctx.fillRect(-13,-25,26,8);
  if(air){ctx.fillRect(-16,-31,5,9);ctx.fillRect(11,-31,5,9);}
  else{ctx.fillRect(-16,-23,5,9);ctx.fillRect(11,-23,5,9);}
  ctx.fillStyle='#fff';
  if(air){ctx.fillRect(-17,-33,6,5);ctx.fillRect(11,-33,6,5);}
  else{ctx.fillRect(-17,-16,6,5);ctx.fillRect(11,-16,6,5);}
  ctx.fillStyle='#ffd23f';ctx.fillRect(-6,-16,3,3);ctx.fillRect(3,-16,3,3);
  ctx.fillStyle='#ffcf9e';ctx.fillRect(-9,-34,18,10);
  ctx.fillStyle='#3a2a1a';ctx.fillRect(-9,-32,3,6);
  ctx.fillStyle='#222';ctx.fillRect(2,-32,3,5);
  ctx.fillStyle='#ffb380';ctx.fillRect(7,-29,5,4);
  ctx.fillStyle='#3a2a1a';ctx.fillRect(1,-26,10,3);
  ctx.fillStyle=starCol||'#e3350d';
  ctx.fillRect(-10,-38,20,5);
  ctx.fillRect(2,-34,12,3);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-1,-35.5,2.6,0,7);ctx.fill();
  ctx.restore();
}
function drawBG(){
  const t=THEMES[lvl.theme];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,t.skyT);g.addColorStop(1,t.skyB);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(t.dark){
    ctx.fillStyle='rgba(255,255,255,0.8)';
    for(let i=0;i<40;i++){
      const x=(i*263+lvl.seed*13)%W,y=(i*127)%260;
      if((frameCount+i*7)%120<100)ctx.fillRect(x,y,2,2);
    }
    if(lvl.theme===7){ctx.fillStyle='#f4ecff';ctx.beginPath();ctx.arc(800,80,28,0,7);ctx.fill();
      ctx.fillStyle=t.skyT;ctx.beginPath();ctx.arc(790,72,24,0,7);ctx.fill();}
  }else{
    ctx.fillStyle=lvl.theme===4?'#ffdd55':'rgba(255,255,220,0.9)';
    ctx.beginPath();ctx.arc(lvl.theme===4?200:780,86,lvl.theme===4?44:30,0,7);ctx.fill();
  }
  if(lvl.theme===3||lvl.theme===7){
    ctx.fillStyle='rgba(0,0,0,0.25)';
    for(let i=-1;i<8;i++){
      const x=i*180-(camX*0.4)%180;
      ctx.fillRect(x,60,26,H);
      ctx.fillRect(x-20,140,66,14);
    }
  }else{
    ctx.fillStyle=t.hillA;
    for(let i=-1;i<6;i++){
      const x=i*320-(camX*0.2)%320;
      ctx.beginPath();ctx.arc(x+160,560,240,Math.PI,0);ctx.fill();
    }
    ctx.fillStyle=t.hillB;
    for(let i=-1;i<7;i++){
      const x=i*240-(camX*0.4)%240;
      ctx.beginPath();ctx.arc(x+120,586,160,Math.PI,0);ctx.fill();
    }
    if(lvl.theme!==6){
      ctx.fillStyle='rgba(255,255,255,0.85)';
      for(let i=0;i<6;i++){
        const x=(i*397+lvl.seed*31)%(W+300)-150-(camX*0.35)%(W+300);
        const xx=((x%(W+300))+(W+300))%(W+300)-150;
        const y=60+(i*53)%150,s2=0.7+(i%3)*0.3;
        ctx.beginPath();
        ctx.arc(xx,y,22*s2,0,7);ctx.arc(xx+24*s2,y-8*s2,18*s2,0,7);ctx.arc(xx+46*s2,y,20*s2,0,7);
        ctx.fill();
      }
    }
  }
}
function drawTiles(){
  const t=THEMES[lvl.theme];
  const gx0=Math.max(0,Math.floor(camX/TS)-1),gx1=Math.min(lvl.cols-1,gx0+29);
  for(let gy=0;gy<ROWS;gy++)for(let gx=gx0;gx<=gx1;gx++){
    const c=lvl.g[gy][gx];if(c==='.')continue;
    const x=gx*TS,y=gy*TS;
    if(c==='#'){
      ctx.fillStyle=t.body;ctx.fillRect(x,y,TS,TS);
      if(tile(gx,gy-1)!=='#'&&tile(gx,gy-1)!=='P'){
        ctx.fillStyle=t.top;ctx.fillRect(x,y,TS,8);
        ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(x,y,TS,3);
      }
      ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(x,y+TS-3,TS,3);
    }else if(c==='X'){
      ctx.fillStyle=lvl.theme>=3?'#5a6272':'#8a909c';ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fillRect(x,y,TS,4);
      ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(x,y+TS-4,TS,4);
    }else if(c==='B'){
      ctx.fillStyle=t.brick;ctx.fillRect(x,y,TS,TS);
      ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=2;
      ctx.strokeRect(x+1,y+1,TS-2,TS-2);
      ctx.beginPath();ctx.moveTo(x,y+TS/2);ctx.lineTo(x+TS,y+TS/2);ctx.stroke();
    }else if(c==='?'||c==='M'){
      const pul=Math.sin(frameCount*0.15+gx)*0.12+0.88;
      ctx.fillStyle=c==='?'?'#f9a825':'#f06292';ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle=`rgba(255,240,150,${0.35*pul})`;ctx.fillRect(x+3,y+3,TS-6,TS-6);
      ctx.strokeStyle=c==='?'?'#8d5a00':'#8e2450';ctx.lineWidth=3;ctx.strokeRect(x+2,y+2,TS-4,TS-4);
      ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
      ctx.fillText(c==='?'?'?':'♥',x+TS/2,y+26);
    }else if(c==='★'){
      ctx.fillStyle='#7e57c2';ctx.fillRect(x,y,TS,TS);
      ctx.strokeStyle='#4527a0';ctx.lineWidth=3;ctx.strokeRect(x+2,y+2,TS-4,TS-4);
      ctx.fillStyle='#ffd740';ctx.font='bold 20px sans-serif';ctx.textAlign='center';
      ctx.fillText('★',x+TS/2,y+26);
    }else if(c==='U'){
      ctx.fillStyle='#9c8a70';ctx.fillRect(x,y,TS,TS);
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,TS-4,TS-4);
    }else if(c==='P'){
      ctx.fillStyle='#2e9e3f';ctx.fillRect(x,y,TS,TS);
      ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(x+4,y,6,TS);
      if(tile(gx,gy-1)!=='P'){
        ctx.fillStyle='#37b94c';ctx.fillRect(x-3,y,TS+6,10);

function drawCurseFX(){

    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  if(hasCurse('reaper')&&p){
    const dist=Math.max(0,Math.min(1,1-(p.x-reaper.x)/420));

    g.addColorStop(0,`rgba(10,5,22,${0.7*dist})`);g.addColorStop(1,'rgba(10,5,22,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,280,H);
    if(dist>0.45&&(frameCount>>4)%2===0)labels.push('💀 死神接近中！！');
  }
  if(hasCurse('mirror'))labels.push('🪞 操作反転中');
  if(hasCurse('whim'))labels.push('🎲 操作:'+((hasCurse('mirror')!==whimSwap)?'逆転中！':'通常'));
  if(hasCurse('wind')){
    if(wind.mode===1&&(frameCount>>3)%2===0)labels.push('🌪️ 突風くるぞ…！');
    if(wind.mode===2)labels.push('🌪️ 突風！！');
  }
  if(hasCurse('meteor'))labels.push('☄️ 空からメテオ！');
  if(hasCurse('flip'))labels.push('🙃 世界が逆さま');
  if(hasCurse('giant'))labels.push('👹 巨大化中！');
  if(hasCurse('hunted'))labels.push('🎯 敵が狂暴化！');
  if(hasCurse('bomb'))labels.push('💣 空に注意！');
  if(labels.length){
    ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    labels.forEach((l,i)=>{
      ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillText(l,W/2+1,H-13-i*19+1);
      ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillText(l,W/2,H-13-i*19);
    });
    ctx.textAlign='left';
  }
}

/* ---------------- ルーレット ---------------- */
function initSpin(){
  let idx;
  do{idx=Math.floor(Math.random()*CURSES.length);}
  while(pendingCurses.length&&CURSES[idx].id===pendingCurses[0].id);
  const seg=Math.PI*2/CURSES.length;
  const j=seg*(0.2+Math.random()*0.6);
  const base=((-(Math.PI/2)-idx*seg-j)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  rou={round:rou.round,t:0,dur:200,angle:0,final:base+Math.PI*2*5,idx,phase:'spin',lastSeg:-1};
}
function startRoulette(){
  pendingCurses=[];
  rou={round:1};
  initSpin();
}
function drawRoulette(){
  ctx.fillStyle='#120c22';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffd740';ctx.font='bold 26px sans-serif';
  ctx.fillText(`STAGE ${stageIdx+1} 〜${lvl.name}〜`,W/2,40);
  if(difficulty==='hard'){
    ctx.fillStyle='#e53935';ctx.font='bold 15px sans-serif';
    ctx.fillText('🔥 HARD：ルーレット2回＝呪い2つ 🔥',W/2,66);
    if(pendingCurses[0]){
      ctx.fillStyle='#cfc8ee';ctx.font='13px sans-serif';
      ctx.fillText('決定済み: '+pendingCurses[0].icon+' '+pendingCurses[0].name,W/2,88);
    }
  }else{
    ctx.fillStyle='#8f88b8';ctx.font='14px sans-serif';
    ctx.fillText('ルーレットで今日の呪いが決まる…！',W/2,66);
  }
  const cx=W/2,cy=H/2+34,R=178;
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2;
    ctx.fillStyle=(frameCount>>3)%2===i%2?'#ffd740':'#5a4d80';
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*(R+14),cy+Math.sin(a)*(R+14),5,0,7);ctx.fill();
  }
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rou.angle);
  const seg=Math.PI*2/CURSES.length;
  for(let i=0;i<CURSES.length;i++){
    ctx.fillStyle=CURSES[i].col;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*seg,(i+1)*seg);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.rotate(i*seg+seg/2);
    ctx.textAlign='center';
    ctx.font='19px sans-serif';ctx.fillText(CURSES[i].icon,R*0.78,7);
    ctx.restore();
  }
  ctx.fillStyle='#241a44';ctx.beginPath();ctx.arc(0,0,32,0,7);ctx.fill();
  ctx.strokeStyle='#ffd740';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#ffd740';ctx.font='bold 15px sans-serif';ctx.fillText('呪',0,5);
  ctx.restore();
  ctx.fillStyle='#ff5252';
  ctx.beginPath();ctx.moveTo(cx-14,cy-R-22);ctx.lineTo(cx+14,cy-R-22);ctx.lineTo(cx,cy-R+6);ctx.closePath();ctx.fill();
  if(rou.phase==='spin'){
    const prog=1-Math.pow(1-Math.min(rou.t/rou.dur,1),3);
    rou.angle=rou.final*prog;rou.t++;
    const segI=Math.floor(rou.angle/seg);
    if(segI!==rou.lastSeg){rou.lastSeg=segI;S.tick();}
    if(rou.t>=rou.dur){
      rou.phase='result';
      pendingCurses.push(CURSES[rou.idx]);
      S.landR();shake=6;
    }
  }else{
    const c=pendingCurses[pendingCurses.length-1];
    ctx.fillStyle='rgba(12,8,26,0.88)';rrect(W/2-260,cy+R-66,520,118,16);ctx.fill();
    ctx.strokeStyle=c.col;ctx.lineWidth=3;rrect(W/2-260,cy+R-66,520,118,16);ctx.stroke();
    const pop=Math.min(1,(rou.t-rou.dur)/15);rou.t++;
    ctx.save();ctx.translate(W/2,cy+R-34);ctx.scale(pop,pop);
    ctx.fillStyle='#cfc8ee';ctx.font='bold 14px sans-serif';
    const head=(difficulty==='hard')?(rou.round===1?'呪い・その1':'呪い・その2'):'今回の呪い';
    ctx.fillText(head,0,-18);
    ctx.fillStyle=c.col;ctx.font='bold 28px sans-serif';
    ctx.fillText(`${c.icon}『${c.name}』！`,0,12);
    ctx.restore();
    ctx.fillStyle='#cfc8ee';ctx.font='14px sans-serif';
    ctx.fillText(c.desc,W/2,cy+R+6);
    if(pop>=1){
      if((frameCount>>4)%2===0){
        ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';
        const prompt=(difficulty==='hard'&&rou.round===1)?'− SPACEで2回目のルーレットへ −':'− SPACEで挑戦 −';
        ctx.fillText(prompt,W/2,cy+R+38);
      }
      if(confirmJP()){
        if(difficulty==='hard'&&rou.round===1){rou.round=2;initSpin();S.select();}
        else{
          activeCurses=pendingCurses.slice();
          curseHistory.push({stage:stageIdx+1,curses:activeCurses.slice()});
          state='intro';introT=0;S.select();
        }
      }
    }
  }
}

}
function startGame(){
  resetAll();stageIdx=0;loadStage(0);state='roulette';startRoulette();S.select();
}

function step(){
  frameCount++;
  if(state==='play'){
    if(jp('KeyP'))paused=!paused;
    if(jp('KeyM')){muted=!muted;toast(muted?'サウンドOFF':'サウンドON','#b8b2d8');}
    if(jp('KeyR')){loadStage(stageIdx);toast('ステージ最初から','#ffd740');}
    if(!paused){
      if(freeze>0){freeze--;}
      else{
        totalTime++;stageTime++;
        updatePlats();updateFmeta();updatePlayer();
        updateEnemies();updateBoss();updateFires();updateStars();
        updateCurseSystems();updateParts();updateCamera();
      }
    }
    musicTick();
  }else if(state==='clear'){
    updateParts();updateCamera();
  }else if(state==='diff'){
    if(jp('ArrowLeft')||jp('KeyA')){diffSel=(diffSel+2)%3;S.tick();}
    if(jp('ArrowRight')||jp('KeyD')){diffSel=(diffSel+1)%3;S.tick();}
    if(jp('KeyR')||jp('Escape')){state='title';}
    if(confirmJP()){
      if(diffSel===2&&!hardUnlocked){S.deny();}
      else{difficulty=DIFFS[diffSel].id;startGame();}
    }
  }
}
function render(){
  ctx.clearRect(0,0,W,H);
  if(state==='title')drawTitle();
  else if(state==='diff')drawDiff();
  else if(state==='roulette')drawRoulette();
  else if(state==='intro')drawIntro();
  else if(state==='play'){
    drawScene();drawHUD();
    if(paused){
      ctx.fillStyle='rgba(0,0,10,0.6)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.textAlign='center';
      ctx.fillText('ポーズ',W/2,H/2);
      ctx.font='16px sans-serif';ctx.fillText('Pキーで再開',W/2,H/2+40);
      ctx.textAlign='left';
    }
  }
  else if(state==='clear')drawClear();
  else if(state==='victory')drawVictory();
}
function loop(){
  requestAnimationFrame(loop);
  step();render();
  pressedQ.clear();
}
loop();
</script>
